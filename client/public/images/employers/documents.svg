<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="600" cy="500" r="200" fill="#005085" opacity="0.06"/>
  <!-- Document stack -->
  <rect x="260" y="140" width="280" height="360" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" transform="rotate(-5 400 320)"/>
  <rect x="270" y="130" width="280" height="360" rx="8" fill="#253348" stroke="#3d5068" stroke-width="1.5" transform="rotate(-2 410 310)"/>
  <rect x="280" y="120" width="280" height="360" rx="8" fill="#2d3f58" stroke="#4a6282" stroke-width="1.5"/>
  <!-- Document content -->
  <rect x="310" y="160" width="100" height="14" rx="4" fill="#005085" opacity="0.7"/>
  <rect x="310" y="190" width="220" height="8" rx="4" fill="white" opacity="0.2"/>
  <rect x="310" y="208" width="200" height="8" rx="4" fill="white" opacity="0.15"/>
  <rect x="310" y="226" width="180" height="8" rx="4" fill="white" opacity="0.15"/>
  <!-- Photo box -->
  <rect x="310" y="260" width="80" height="100" rx="6" fill="#005085" opacity="0.2"/>
  <circle cx="350" cy="295" r="20" fill="#005085" opacity="0.4"/>
  <rect x="335" y="320" width="30" height="30" rx="6" fill="#005085" opacity="0.4"/>
  <!-- Info fields -->
  <rect x="410" y="270" width="100" height="8" rx="4" fill="white" opacity="0.2"/>
  <rect x="410" y="290" width="120" height="8" rx="4" fill="white" opacity="0.15"/>
  <rect x="410" y="310" width="90" height="8" rx="4" fill="white" opacity="0.15"/>
  <rect x="410" y="330" width="110" height="8" rx="4" fill="white" opacity="0.15"/>
  <!-- Checkmark stamp -->
  <circle cx="490" cy="420" r="30" fill="none" stroke="#4ade80" stroke-width="3" opacity="0.7"/>
  <polyline points="475,420 485,432 508,408" stroke="#4ade80" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- Floating seal -->
  <circle cx="180" cy="200" r="35" fill="#c87533" opacity="0.15"/>
  <circle cx="180" cy="200" r="25" fill="#c87533" opacity="0.2"/>
  <circle cx="180" cy="200" r="15" fill="#c87533" opacity="0.3"/>
  <!-- Floating pen -->
  <rect x="620" y="250" width="8" height="60" rx="4" fill="#c87533" opacity="0.5" transform="rotate(30 624 280)"/>
  <polygon points="620,310 624,325 628,310" fill="#c87533" opacity="0.5" transform="rotate(30 624 318)"/>
</svg>
