  <rect x="240" y="462" width="70" height="8" rx="4" fill="white" opacity="0.3"/>
  <!-- 24/7 badge -->
  <circle cx="550" cy="200" r="35" fill="#4ade80" opacity="0.2"/>
  <circle cx="550" cy="200" r="25" fill="#4ade80" opacity="0.3"/>
  <rect x="535" y="195" width="30" height="10" rx="3" fill="white" opacity="0.5"/>
