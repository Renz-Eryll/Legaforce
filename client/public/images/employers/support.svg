  <rect x="200" y="380" width="140" height="40" rx="12" fill="#005085" opacity="0.3"/>
  <rect x="210" y="392" width="80" height="8" rx="4" fill="white" opacity="0.3"/>
  <rect x="210" y="404" width="60" height="6" rx="3" fill="white" opacity="0.2"/>
  <rect x="460" y="400" width="160" height="40" rx="12" fill="#c87533" opacity="0.3"/>
