<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c87533"/>
      <stop offset="100%" stop-color="#8b5023"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="250" fill="white" opacity="0.04"/>
  <circle cx="200" cy="100" r="150" fill="white" opacity="0.03"/>
  <!-- Globe -->
  <circle cx="400" cy="250" r="120" fill="none" stroke="white" stroke-width="2" opacity="0.2"/>
  <circle cx="400" cy="250" r="80" fill="none" stroke="white" stroke-width="1.5" opacity="0.15"/>
  <ellipse cx="400" cy="250" rx="120" ry="50" fill="none" stroke="white" stroke-width="1" opacity="0.15"/>
  <ellipse cx="400" cy="250" rx="60" ry="120" fill="none" stroke="white" stroke-width="1" opacity="0.12"/>
  <line x1="400" y1="130" x2="400" y2="370" stroke="white" stroke-width="1" opacity="0.1"/>
  <line x1="280" y1="250" x2="520" y2="250" stroke="white" stroke-width="1" opacity="0.1"/>
  <!-- Location pins -->
  <circle cx="350" cy="200" r="8" fill="white" opacity="0.5"/>
  <polygon points="350,208 345,218 355,218" fill="white" opacity="0.5"/>
  <circle cx="450" cy="220" r="8" fill="white" opacity="0.5"/>
  <polygon points="450,228 445,238 455,238" fill="white" opacity="0.5"/>
  <circle cx="380" cy="290" r="8" fill="white" opacity="0.4"/>
  <polygon points="380,298 375,308 385,308" fill="white" opacity="0.4"/>
  <circle cx="430" cy="180" r="6" fill="white" opacity="0.35"/>
  <polygon points="430,186 426,194 434,194" fill="white" opacity="0.35"/>
  <!-- Connection arcs -->
  <path d="M350 200 Q 380 180 430 180" stroke="white" stroke-width="1" opacity="0.2" fill="none" stroke-dasharray="4 2"/>
  <path d="M450 220 Q 420 260 380 290" stroke="white" stroke-width="1" opacity="0.15" fill="none" stroke-dasharray="4 2"/>
  <!-- People silhouettes around globe -->
  <circle cx="180" cy="300" r="18" fill="white" opacity="0.15"/>
  <rect x="170" y="322" width="20" height="25" rx="4" fill="white" opacity="0.1"/>
  <circle cx="620" cy="300" r="18" fill="white" opacity="0.15"/>
  <rect x="610" y="322" width="20" height="25" rx="4" fill="white" opacity="0.1"/>
  <!-- Stars -->
  <circle cx="300" cy="120" r="3" fill="white" opacity="0.3"/>
  <circle cx="500" cy="400" r="3" fill="white" opacity="0.25"/>
  <circle cx="650" cy="150" r="2" fill="white" opacity="0.2"/>
  <circle cx="150" cy="450" r="2.5" fill="white" opacity="0.22"/>
  <!-- Rising rays -->
  <rect x="340" y="420" width="30" height="80" rx="4" fill="white" opacity="0.06"/>
  <rect x="385" y="400" width="30" height="100" rx="4" fill="white" opacity="0.08"/>
  <rect x="430" y="380" width="30" height="120" rx="4" fill="white" opacity="0.1"/>
</svg>
