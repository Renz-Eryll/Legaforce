      <stop offset="0%" stop-color="#005085"/>
      <stop offset="100%" stop-color="#003255"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="250" fill="#c87533" opacity="0.06"/>
